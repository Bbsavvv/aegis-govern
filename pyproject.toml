[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-govern"
version = "0.1.0"
description = "Autonomous AI Governance & Security Enforcement Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "eval-type-backport>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
aegis-loop = "aegis_core.runtime:main"
aegis-api = "api.app:run"

[tool.setuptools.packages.find]
include = [
  "aegis_core*",
  "telemetry_sentinel*",
  "regulatory_crosswalker*",
  "remediator_engine*",
  "acquisition_engine*",
  "api*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
